<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Parallax Portfolio</title>
    <style>
        /* 1. SETUP DASAR & MINIMALIS */
        :root {
            --bg-color: #f4f4f4;
            --text-color: #1a1a1a;
            --accent-color: #333;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden; /* Mencegah scroll samping */
        }

        /* 2. CUSTOM CURSOR (INTERAKTIF) */
        .cursor {
            width: 20px;
            height: 20px;
            border: 1px solid var(--text-color);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s, background-color 0.3s;
            mix-blend-mode: difference;
        }
        
        .cursor.hovered {
            width: 50px;
            height: 50px;
            background-color: white;
            border-color: white;
        }

        /* 3. PARALLAX SECTIONS */
        section {
            position: relative;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            box-sizing: border-box;
        }

        /* Efek Sticky untuk Parallax tumpuk */
        .sticky-section {
            position: sticky;
            top: 0;
            background-color: var(--bg-color);
            box-shadow: 0 -10px 20px rgba(0,0,0,0.05); /* Bayangan halus */
        }

        /* HERO SECTION */
        .hero {
            z-index: 1;
            flex-direction: column;
            align-items: flex-start;
            padding-left: 10%;
        }

        h1 {
            font-size: 5rem;
            line-height: 1;
            margin: 0;
            font-weight: 300;
            letter-spacing: -2px;
            opacity: 0;
            animation: fadeIn Up 1s forwards 0.5s;
        }

        .subtitle {
            font-size: 1.2rem;
            margin-top: 20px;
            opacity: 0.6;
        }

        /* SHAPE MENGAMBANG (PARALLAX ELEMEN) */
        .floating-shape {
            position: absolute;
            right: 10%;
            top: 20%;
            width: 300px;
            height: 300px;
            background-color: #e0e0e0;
            border-radius: 50%;
            z-index: -1;
        }

        /* ABOUT SECTION */
        .about {
            z-index: 2;
            background-color: #1a1a1a;
            color: #f4f4f4;
        }

        .content-box {
            max-width: 600px;
        }

        /* WORK SECTION */
        .work {
            z-index: 3;
            background-color: #f4f4f4;
            color: #1a1a1a;
        }
        
        .project-card {
            width: 100%;
            max-width: 800px;
            height: 400px;
            background-color: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.5s ease;
        }

        .project-card:hover {
            transform: scale(0.98); /* Interaktif saat hover */
        }

        /* ANIMATION */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* TOMBOL HOVER TARGET */
        a.btn {
            display: inline-block;
            margin-top: 30px;
            text-decoration: none;
            color: inherit;
            border-bottom: 1px solid currentColor;
            padding-bottom: 5px;
            cursor: none; /* Hilangkan kursor asli */
        }

    </style>
</head>
<body>

    <div class="cursor" id="cursor"></div>

    <section class="sticky-section hero">
        <div class="floating-shape" id="shape"></div>
        <h1>Hello.<br>I am a Creator.</h1>
        <p class="subtitle">Scrolling down to discover more.</p>
    </section>

    <section class="sticky-section about">
        <div class="content-box">
            <h2>Minimalist Approach</h2>
            <p>Saya percaya bahwa desain yang baik adalah sesedikit mungkin desain. Fokus pada esensi, fungsi, dan kejernihan.</p>
            <a href="#" class="btn hover-target">Read My Bio</a>
        </div>
    </section>

    <section class="sticky-section work">
        <div class="content-box">
            <h2>Latest Work</h2>
            <div class="project-card hover-target">
                <h3>Project Alpha</h3>
            </div>
        </div>
    </section>

    <script>
        // 1. LOGIKA CUSTOM CURSOR
        const cursor = document.getElementById('cursor');
        const hoverTargets = document.querySelectorAll('.hover-target');

        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        hoverTargets.forEach(target => {
            target.addEventListener('mouseenter', () => cursor.classList.add('hovered'));
            target.addEventListener('mouseleave', () => cursor.classList.remove('hovered'));
        });

        // 2. LOGIKA PARALLAX SEDERHANA
        window.addEventListener('scroll', () => {
            const scrolled = window.pageYOffset;
            const shape = document.getElementById('shape');
            
            // Menggerakkan lingkaran di background lebih lambat dari scroll (efek depth)
            shape.style.transform = `translateY(${scrolled * 0.5}px)`;
        });
    </script>
</body>
</html>
