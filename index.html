<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Minimalist Portfolio</title>
    <style>
        /* 1. RESET & VARIABLES */
        :root {
            --bg-color: #f4f4f4;
            --text-color: #1a1a1a;
            --accent-color: #333;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden; /* Mencegah scroll samping */
        }

        /* 2. CUSTOM CURSOR (DESKTOP ONLY) */
        .cursor {
            width: 20px;
            height: 20px;
            border: 1px solid var(--text-color);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s, background-color 0.3s;
            mix-blend-mode: difference;
            display: none; /* Default hidden, dinyalakan via JS di desktop */
        }
        
        .cursor.hovered {
            width: 50px;
            height: 50px;
            background-color: white;
            border-color: white;
        }

        /* 3. LAYOUT & SECTIONS */
        section {
            position: relative;
            min-height: 100vh; /* Full screen height */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            width: 100%;
        }

        /* Sticky Effect (Tumpukan Kartu) */
        .sticky-section {
            position: sticky;
            top: 0;
            background-color: var(--bg-color);
            box-shadow: 0 -5px 15px rgba(0,0,0,0.03);
            overflow: hidden;
        }

        /* HERO SECTION */
        .hero {
            z-index: 1;
            flex-direction: column;
            align-items: flex-start;
            padding-left: 10%; /* Desktop padding */
            padding-right: 5%;
        }

        /* Responsive Font Size using CLAMP 
           (Min: 3rem, Ideal: 8vw, Max: 6rem) */
        h1 {
            font-size: clamp(3rem, 8vw, 6rem); 
            line-height: 1.1;
            margin: 0;
            font-weight: 300;
            letter-spacing: -2px;
            opacity: 0;
            animation: fadeInUp 1s forwards 0.5s;
            position: relative;
            z-index: 2;
        }

        .subtitle {
            font-size: clamp(1rem, 2vw, 1.5rem);
            margin-top: 20px;
            opacity: 0.6;
            max-width: 90%;
            z-index: 2;
        }

        /* Shape Background */
        .floating-shape {
            position: absolute;
            right: 5%;
            top: 20%;
            width: clamp(200px, 30vw, 400px); /* Responsive Size */
            height: clamp(200px, 30vw, 400px);
            background-color: #e0e0e0;
            border-radius: 50%;
            z-index: 1;
        }

        /* ABOUT SECTION */
        .about {
            z-index: 2;
            background-color: #1a1a1a;
            color: #f4f4f4;
            text-align: left;
        }

        .content-box {
            max-width: 800px;
            width: 100%;
        }

        .content-box h2 {
            font-size: clamp(2rem, 5vw, 4rem);
            margin-bottom: 1rem;
        }
        
        .content-box p {
            font-size: clamp(1rem, 1.5vw, 1.2rem);
            line-height: 1.6;
            opacity: 0.8;
        }

        /* WORK SECTION */
        .work {
            z-index: 3;
            background-color: #f4f4f4;
            color: #1a1a1a;
            flex-direction: column;
        }
        
        .project-card {
            width: 100%;
            max-width: 800px;
            height: clamp(250px, 40vh, 400px); /* Height responsive */
            background-color: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.5s ease;
            margin-top: 2rem;
            border-radius: 8px;
        }

        .project-card h3 {
            font-size: 2rem;
        }

        /* ANIMATION */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* BUTTON */
        a.btn {
            display: inline-block;
            margin-top: 30px;
            text-decoration: none;
            color: inherit;
            border-bottom: 1px solid currentColor;
            padding-bottom: 5px;
            font-size: 1.2rem;
        }

        /* 4. MEDIA QUERIES (KHUSUS HP) */
        @media (max-width: 768px) {
            .hero {
                padding-left: 2rem;
                padding-right: 2rem;
                justify-content: center; /* Tengah secara vertikal di HP */
            }

            .floating-shape {
                right: -50px; /* Geser sedikit keluar layar biar artistik */
                top: 15%;
                opacity: 0.5; /* Lebih transparan di HP biar teks terbaca */
            }

            /* Matikan logic cursor custom di CSS level juga */
            .cursor {
                display: none !important; 
            }
            
            /* Kembalikan cursor default */
            a.btn, .project-card {
                cursor: pointer;
            }
            
            section {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="cursor" id="cursor"></div>

    <section class="sticky-section hero">
        <div class="floating-shape" id="shape"></div>
        <h1>Hello.<br>I am a Creator.</h1>
        <p class="subtitle">Designed for simplicity and impact.</p>
    </section>

    <section class="sticky-section about">
        <div class="content-box">
            <h2>Minimalist.</h2>
            <p>Di layar seluler, desain ini tetap terbaca dengan jelas. Ruang kosong (whitespace) dijaga agar mata tidak lelah, sementara tipografi menyesuaikan ukuran layar secara otomatis.</p>
            <a href="#" class="btn hover-target">Read My Bio</a>
        </div>
    </section>

    <section class="sticky-section work">
        <div class="content-box">
            <h2>Latest Work</h2>
            <div class="project-card hover-target">
                <h3>Project
